spring.application.name=API-GATEWAY

server.port=8088
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=productServiceMapping
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE

spring.cloud.gateway.server.webflux.routes[1].id=paymentServiceMapping
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/payments/**
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAYMENT-SERVICE

spring.cloud.gateway.server.webflux.routes[2].id=authtServerMapping
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTH-SERVER